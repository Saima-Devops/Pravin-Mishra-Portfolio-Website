
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            color: #1f2937;
            padding: 20px;
        }

        .error-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            line-height: 1;
            color: #2563eb;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #111827;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 13px 28px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .home-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .error-container {
                padding: 45px 25px;
            }

            .error-code {
                font-size: 75px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist or may have been moved.
            Don't worry — let's get you back to the portfolio.
        </p>

        <a href="index.html" class="home-button">
            Back to Portfolio
        </a>

        <div class="footer">
            &copy; 2026 Pravin Mishra DevOps Portfolio. All rights reserved.
        </div>

    </main>

</body>
</html>
